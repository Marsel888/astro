services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: meridian
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  # Runs once per deploy and exits. The app waits for it to finish, so a fresh
  # server gets its schema before the first request instead of 500ing on an
  # empty database.
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://meridian:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/meridian

  app:
    build:
      context: .
      target: runner
      args:
        # Must match SITE_URL below — it is compiled into the canonical tags.
        SITE_URL: ${SITE_URL:?SITE_URL is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      BETTER_AUTH_URL: ${SITE_URL:?SITE_URL is required}
      DATABASE_URL: postgres://meridian:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/meridian
      REDIS_URL: redis://cache:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "3000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
