<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SideraChart">
  <!-- Same tokens as the site: --bg-deep behind, --gold on top. -->
  <rect width="64" height="64" rx="14" fill="#0b0e14"/>
  <!-- The chart wheel. Deliberately faint: at 16px it fades out and the star
       carries the mark on its own, rather than turning into a grey smudge. -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#d9a441" stroke-width="2.5" opacity="0.42"/>
  <!-- Sidera — stars. Chunky enough to stay legible in a browser tab. -->
  <path
    d="M32 10.5 C33.6 24 40 30.4 53.5 32 C40 33.6 33.6 40 32 53.5 C30.4 40 24 33.6 10.5 32 C24 30.4 30.4 24 32 10.5 Z"
    fill="#d9a441"/>
</svg>
